<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4efe4" />
  <title>Ganty Project Index</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    :root {
      --paper:#f4efe4; --paper-deep:#ebe3d3; --ink:#202c25; --muted:#788078;
      --green:#183d32; --green-2:#245344; --green-soft:#e2eae2;
      --rust:#b85e3d; --gold:#c99b4a; --line:#dcd5c7; --white:#fffdf8;
      --shadow:0 14px 40px rgba(35,48,39,.08);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:90px}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;overflow-x:hidden}
    button,input,a{font:inherit}
    a{color:inherit;text-decoration:none}
    ::selection{background:#c99b4a;color:#172a22}
    ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:var(--paper)}::-webkit-scrollbar-thumb{background:#b9b09f;border-radius:9px}::-webkit-scrollbar-thumb:hover{background:var(--green-2)}
    .app-shell{min-height:100vh}
    .masthead{height:76px;padding:0 clamp(18px,4vw,58px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(244,239,228,.94);position:sticky;top:0;z-index:30;backdrop-filter:blur(14px)}
    .brand{display:flex;align-items:center;gap:12px;font-family:Manrope,sans-serif;font-weight:800;letter-spacing:-.04em;font-size:17px}
    .brand-mark{width:37px;height:37px;border-radius:11px;background:var(--green);color:#f4d69a;display:grid;place-items:center;font-size:18px}
    .brand small{display:block;font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.18em;color:#7a8278;font-weight:800;margin-top:2px}
    .mast-links{display:flex;align-items:center;gap:25px;color:#667168;font-size:12px;font-weight:700}
    .mast-links a:hover{color:var(--rust)}
    .mast-right{display:flex;align-items:center;gap:12px}
    .season-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-2);font-weight:800;padding:9px 12px;border:1px solid #cbd6ca;border-radius:99px;background:#edf1e8}
    .page{max-width:1440px;margin:0 auto;padding:34px clamp(16px,3.8vw,54px) 70px}
    .intro{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:24px;margin-bottom:27px}
    .intro-copy{min-height:280px;border-radius:24px;padding:clamp(26px,4vw,48px);background:var(--green);color:#fffdf5;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
    .intro-copy:before{content:"";position:absolute;width:370px;height:370px;border:1px solid #ffffff17;border-radius:50%;right:-105px;top:-185px;box-shadow:0 0 0 28px #ffffff08,0 0 0 58px #ffffff06,0 0 0 90px #ffffff04}
    .intro-copy:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;background:#c99b4a14;right:9%;bottom:-150px;filter:blur(4px)}
    .kicker{font-size:10px;text-transform:uppercase;letter-spacing:.22em;font-weight:800;color:#e5c88e;position:relative;z-index:1}
    h1{font-family:Manrope,sans-serif;font-size:clamp(42px,6vw,76px);letter-spacing:-.075em;line-height:.98;margin:17px 0 15px;max-width:760px;position:relative;z-index:1}
    .intro-copy p{font-size:15px;line-height:1.75;color:#d3ded4;max-width:590px;margin:0;position:relative;z-index:1}
    .intro-bottom{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:27px;position:relative;z-index:1}
    .browse-btn{background:#e4bd73;color:#20362b;padding:12px 17px;border-radius:9px;font-size:12px;font-weight:800;transition:.2s}
    .browse-btn:hover{background:#f1d49c;transform:translateY(-2px)}
    .total-note{font-size:11px;color:#bdcfc1;font-weight:600}
    .countdown{border:1px solid #d9d0bf;border-radius:24px;background:var(--white);padding:25px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);min-height:280px}
    .count-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .count-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(--rust);font-weight:800}
    .count-title{font-family:Manrope,sans-serif;font-size:23px;line-height:1.15;letter-spacing:-.05em;font-weight:800;margin-top:8px}
    .date-pill{font-size:10px;color:#647166;background:#edf1e8;border-radius:99px;padding:8px 10px;white-space:nowrap;font-weight:800}
    .count-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:25px}
    .count-cell{background:#f1eee5;border:1px solid #e4ddcf;border-radius:12px;text-align:center;padding:13px 5px}
    .count-number{font-family:Manrope,sans-serif;font-size:clamp(23px,3vw,34px);font-weight:800;letter-spacing:-.06em;color:var(--green);line-height:1}
    .count-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#8b9187;font-weight:800;margin-top:8px}
    .count-foot{font-size:11px;color:#7b847b;margin-top:13px}
    .workspace{display:grid;grid-template-columns:235px minmax(0,1fr);gap:25px;align-items:start}
    .sidebar{position:sticky;top:98px;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 25px rgba(35,48,39,.04)}
    .side-heading{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#96988d;font-weight:800;margin:5px 10px 12px}
    .side-button{width:100%;border:0;background:transparent;color:#657168;display:flex;align-items:center;gap:11px;text-align:left;padding:11px 12px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;transition:.18s;margin:2px 0}
    .side-button:hover{background:#f1f3ed;color:var(--green)}
    .side-button.active{background:var(--green);color:#fffdf5}
    .side-icon{width:23px;text-align:center;font-size:15px}
    .side-count{margin-left:auto;font-size:10px;opacity:.65}
    .side-divider{height:1px;background:var(--line);margin:15px 4px}
    .side-note{padding:12px;border-radius:11px;background:#f3eee3;color:#788077;font-size:10px;line-height:1.6}
    .collection{min-width:0}
    .collection-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:4px 0 19px}
    .section-kicker{font-size:9px;text-transform:uppercase;letter-spacing:.2em;color:var(--rust);font-weight:800;margin-bottom:7px}
    .section-title{font-family:Manrope,sans-serif;font-size:clamp(25px,3vw,35px);letter-spacing:-.06em;line-height:1.05;font-weight:800;margin:0}
    .section-sub{font-size:12px;color:#858b80;margin-top:7px}
    .search{width:min(330px,100%);height:44px;background:var(--white);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 13px;transition:.2s}
    .search:focus-within{border-color:#8da596;box-shadow:0 0 0 3px #24534412}
    .search input{border:0;outline:0;background:transparent;width:100%;font-size:12px;color:var(--ink)}
    .search input::placeholder{color:#a0a398}
    .mobile-categories{display:none}
    .results-meta{display:flex;justify-content:space-between;align-items:center;color:#92968c;font-size:10px;font-weight:700;margin:0 0 13px}
    .project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .project-card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:17px;min-height:186px;display:flex;flex-direction:column;transition:transform .18s,border-color .18s,box-shadow .18s}
    .project-card:hover{transform:translateY(-3px);border-color:#b7c5b6;box-shadow:0 12px 28px rgba(35,48,39,.07)}
    .project-top{display:flex;gap:12px;align-items:flex-start}
    .project-icon{width:38px;height:38px;display:grid;place-items:center;flex-shrink:0;border-radius:10px;background:#edf1e8;color:var(--green);font-size:17px}
    .project-title{font-family:Manrope,sans-serif;font-size:14px;font-weight:800;line-height:1.3;letter-spacing:-.025em;color:#25362c}
    .project-category{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#9b8c76;font-weight:800;margin-top:5px}
    .project-description{font-size:11px;line-height:1.6;color:#7d857c;margin:13px 0 15px}
    .project-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
    .project-actions a,.project-actions button{border-radius:8px;padding:8px 11px;font-size:10px;font-weight:800;cursor:pointer;transition:.18s}
    .open-external{background:var(--green);color:#fffdf5}.open-external:hover{background:#2d5c4b;transform:translateY(-1px)}
    .open-embedded{background:#f0e9d9;color:#6e4d29;border:1px solid #e4d6bd}.open-embedded:hover{background:#e8dcc5;transform:translateY(-1px)}
    .empty-state{grid-column:1/-1;text-align:center;padding:55px 20px;background:var(--white);border:1px dashed #cfc8b9;border-radius:15px}
    .footer{border-top:1px solid var(--line);padding:25px 20px;text-align:center;color:#8c9187;font-size:10px}
    .footer strong{color:var(--green);letter-spacing:.12em}
    .viewer-backdrop{position:fixed;inset:0;z-index:100;background:rgba(17,29,23,.78);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:clamp(8px,2vw,24px)}
    .viewer-window{width:min(1500px,100%);height:min(92vh,1000px);background:#fffdf8;border:1px solid #c8d1c7;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 100px #0006}
    .viewer-toolbar{display:flex;align-items:center;gap:12px;padding:12px 15px;background:#edf1e8;border-bottom:1px solid #d6ded4;min-height:58px}
    .viewer-title{font-weight:800;color:var(--green);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:13px}
    .viewer-toolbar button,.viewer-toolbar a{border:1px solid #cbd6ca;background:#fffdf8;color:var(--green);border-radius:8px;padding:8px 11px;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer}
    .viewer-toolbar button:hover,.viewer-toolbar a:hover{background:#e1e9df}
    .viewer-frame{width:100%;height:100%;flex:1;border:0;background:#fff}
    .viewer-note{font-size:10px;color:#778278;padding:8px 14px;background:#f5f2e9;border-top:1px solid #e4ddcf}
    @media(max-width:900px){.intro{grid-template-columns:1fr}.intro-copy,.countdown{min-height:unset}.workspace{grid-template-columns:1fr}.sidebar{display:none}.mobile-categories{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;margin-bottom:13px}.mobile-categories .side-button{width:auto;white-space:nowrap;flex-shrink:0;background:var(--white);border:1px solid var(--line);margin:0}.mobile-categories .side-button.active{background:var(--green);border-color:var(--green)}}
    @media(max-width:620px){.masthead{height:64px}.mast-links,.season-label{display:none}.page{padding-top:18px}.intro-copy{min-height:270px}.countdown{padding:20px}.collection-head{align-items:stretch;flex-direction:column}.search{width:100%}.project-grid{grid-template-columns:1fr}.project-card{min-height:unset}.count-grid{gap:5px}.count-cell{padding:12px 3px}.count-number{font-size:25px}.viewer-backdrop{padding:0}.viewer-window{height:100dvh;border-radius:0}.viewer-toolbar{gap:7px;padding:9px}.viewer-toolbar button,.viewer-toolbar a{padding:8px;font-size:10px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>

    const categoryIcons={school:'▦',games:'◈',misc:'⌘',oink:'●',familiar:'◎'};

      const [query,setQuery]=useState('');
      const [active,setActive]=useState('all');
      const [time,setTime]=useState(new Date());
      const [selectedProject,setSelectedProject]=useState(null);
      useEffect(()=>{const t=setInterval(()=>setTime(new Date()),1000);return()=>clearInterval(t)},[]);
      useEffect(()=>{const onKey=e=>{if(e.key==='Escape')setSelectedProject(null)};window.addEventListener('keydown',onKey);return()=>window.removeEventListener('keydown',onKey)},[]);

        </header>
        <main id="top" className="page">
          <section className="intro">
            <div className="intro-copy">
              <div className="kicker">A personal archive of experiments</div>
              <h1>Made to be<br/>clicked, played & explored.</h1>
              <p>A growing collection of games, tools, experiments, and side projects. Find something interesting and see where it takes you.</p>
              <div className="intro-bottom"><a href="#collection" className="browse-btn">Browse the directory&nbsp; →</a><span className="total-note">{total} projects · 6 collections</span></div>
            </div>
            <aside className="countdown" id="countdown">
              <div className="count-top"><div><div className="count-kicker">The next gathering</div><div className="count-title">Time until<br/>Thanksgiving dinner</div></div><span className="date-pill">NOV 26 · 6:00 PM</span></div>
              {diff>0?<div className="count-grid">{[[days,'Days'],[hours,'Hours'],[minutes,'Minutes'],[seconds,'Seconds']].map(([n,label])=><div className="count-cell" key={label}><div className="count-number">{String(n).padStart(2,'0')}</div><div className="count-label">{label}</div></div>)}</div>:<div className="count-cell" style={{marginTop:24,padding:20}}><div className="count-number" style={{fontSize:25}}>Dinner is served.</div><div className="count-label">Happy Thanksgiving</div></div>}
              <div className="count-foot">Counting down to November 26, 2026 at 6:00 PM · your local time</div>
            </aside>
          </section>
          <div className="workspace" id="categories">
            <aside className="sidebar"><div className="side-heading">Browse directory</div>{categoryButtons}<div className="side-divider"></div><div className="side-note">A hand-built collection of projects, experiments, and things worth clicking.</div></aside>
            <section className="collection" id="collection">
              <div className="mobile-categories">{categoryButtons}</div>
              <div className="collection-head"><div><div className="section-kicker">The directory</div><h2 className="section-title">Explore the collection</h2><p className="section-sub">Choose a category or search for a specific project.</p></div>
                <label className="search"><span style={{color:'#879087'}}>⌕</span><input aria-label="Search projects" placeholder="Search projects..." value={query} onChange={e=>handleSearch(e.target.value)}/>{query&&<button onClick={()=>setQuery('')} aria-label="Clear search" style={{border:0,background:'none',color:'#879087',cursor:'pointer'}}>×</button>}</label>
              </div>
              <div className="results-meta"><span>{active==='all'?'ALL COLLECTIONS':projectData[active].name.toUpperCase()}</span><span>{filtered.reduce((n,c)=>n+c.items.length,0)} RESULTS</span></div>
              {filtered.length?filtered.map((cat,index)=><section key={cat.key} className="category-panel">
                <div className="flex items-center gap-3 mb-3"><div className="category-title-icon">{categoryIcons[cat.key]||'◦'}</div><div className="flex-1"><h3 className="section-title" style={{fontSize:21}}>{cat.name}</h3><p className="text-xs" style={{color:'#92958b',marginTop:4}}>{cat.items.length} {cat.items.length===1?'project':'projects'}</p></div></div>
                <div className="project-grid">{cat.items.map((item,i)=><article key={item.title} className="project-card">
                  <div className="project-top"><div className="project-icon">{['▣','◈','⌘','✳','↗','▤'][(i+index*2)%6]}</div><div><h4 className="project-title">{item.title}</h4><div className="project-category">{cat.name}</div></div></div>
                  <p className="project-description">{item.description}</p>
                  <div className="project-actions"><a className="open-external" href={item.link} target="_blank" rel="noopener noreferrer">{cat.actionText} project ↗</a><button className="open-embedded" type="button" onClick={()=>setSelectedProject(item)}>Open here ↗</button></div>
                </article>)}</div>
              </section>):<div className="empty-state"><div style={{fontSize:30,color:'#b85e3d',marginBottom:12}}>⌕</div><h3 style={{fontWeight:800,color:'#25362c'}}>No matching projects</h3><p style={{fontSize:12,color:'#858b80'}}>Try a different search or browse all categories.</p><button className="browse-btn" style={{marginTop:14,border:0,cursor:'pointer'}} onClick={()=>{setQuery('');setActive('all')}}>Clear filters</button></div>}
            </section>
          </div>
        </main>
        {selectedProject&&<div className="viewer-backdrop" role="dialog" aria-modal="true" aria-label={`Viewing ${selectedProject.title}`} onMouseDown={e=>{if(e.target===e.currentTarget)setSelectedProject(null)}}><div className="viewer-window"><div className="viewer-toolbar"><div className="viewer-title">{selectedProject.title}</div><a href={selectedProject.link} target="_blank" rel="noopener noreferrer">Open in new tab ↗</a><button type="button" onClick={()=>setSelectedProject(null)} aria-label="Close project viewer">✕ Close</button></div><iframe className="viewer-frame" src={selectedProject.link} title={selectedProject.title} allow="fullscreen; autoplay; clipboard-read; clipboard-write" referrerPolicy="strict-origin-when-cross-origin"></iframe><div className="viewer-note">If this project appears blank or refuses to load, its website may block iframe embedding. Use “Open in new tab” above instead.</div></div></div>}
        <footer className="footer"><strong>GANTY PROJECT INDEX</strong><div style={{marginTop:7}}>A collection of things made out of curiosity.</div><a href="#top" style={{display:'inline-block',marginTop:13,color:'#b85e3d',fontWeight:800}}>Back to top ↑</a></footer>
      </div>
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
