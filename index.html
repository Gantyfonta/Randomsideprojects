<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Adventurer's Guild - Quest Board</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=MedievalSharp&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Cinzel', serif;
        background-color: #0e0a07;
        background-image: 
          radial-gradient(circle at 50% 20%, rgba(180, 83, 9, 0.15) 0%, transparent 60%),
          radial-gradient(circle at 80% 80%, rgba(120, 53, 15, 0.1) 0%, transparent 50%);
        color: #f1e5d1;
      }

      .medieval-title {
        font-family: 'MedievalSharp', cursive;
      }

      .mono-text {
        font-family: 'Share Tech Mono', monospace;
      }

      /* Tavern Wood Panel Visual Effect */
      .wood-panel {
        background: #1c130d;
        background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.3) 100%),
                          repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.15) 40px, rgba(0,0,0,0.15) 41px);
        box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9), 0 15px 35px rgba(0, 0, 0, 0.8);
      }

      /* Parchment Card Styling */
      .parchment-card {
        background: #ebd2ad;
        background-image: radial-gradient(circle at 50% 50%, #f4e4bc 0%, #d8b884 100%);
        color: #2b1810;
        box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 0 15px rgba(139, 69, 19, 0.3);
        border: 2px solid #b38e58;
      }

      .parchment-card:hover {
        box-shadow: 0 15px 30px rgba(234, 179, 8, 0.25), inset 0 0 20px rgba(139, 69, 19, 0.2);
      }

      /* Wax Seal Effect */
      .wax-seal {
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5), inset 0 -3px 6px rgba(0, 0, 0, 0.4), inset 0 3px 6px rgba(255, 255, 255, 0.3);
      }

      html { scroll-behavior: smooth; }

      ::-webkit-scrollbar { width: 10px; }
      ::-webkit-scrollbar-track { background: #120b07; }
      ::-webkit-scrollbar-thumb { background: #5c3a21; border-radius: 5px; border: 1px solid #2b1810; }
      ::-webkit-scrollbar-thumb:hover { background: #825331; }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="antialiased selection:bg-amber-700 selection:text-amber-100 min-h-screen py-8">
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      // -----------------------------------------------------------------
      // QUEST DATA CATALOG WITH RPG METADATA
      // -----------------------------------------------------------------
      const questCatalog = [
        // SAGE SCROLLS (School)
        { id: 'S1', title: 'Latin Dictionary WIP', description: 'Latin dictionary for all your latin dictionary needs!', link: 'https://gantyfonta.github.io/LD/', category: 'sage', categoryName: 'Sage Scrolls', rank: 'B', reward: '450 Gold • +50 Wisdom', icon: '📜' },
        { id: 'S2', title: 'Significant Figures Calc', description: 'Do math with rounding and automatic SF handling.', link: 'https://gantyfonta.github.io/SigFigCalc/', category: 'sage', categoryName: 'Sage Scrolls', rank: 'C', reward: '200 Gold • Alchemy Skill', icon: '📐' },
        { id: 'S3', title: 'Latin AI Guildmaster', description: 'Ask for help to an AI chatbot.', link: 'https://latinusmagister.base44.app/', category: 'sage', categoryName: 'Sage Scrolls', rank: 'A', reward: '900 Gold • Arcane Tome', icon: '🤖' },
        { id: 'S4', title: 'Outlet Flashcard Grimoire', description: 'Paste in flashcards or vocab words and study them.', link: 'https://owtlette.base44.app/', category: 'sage', categoryName: 'Sage Scrolls', rank: 'B', reward: '500 Gold • Memory Charm', icon: '🎴' },
        { id: 'S5', title: 'Things From Grammer', description: 'I purposely misspelled Grammar to ragbait tesco.', link: 'https://gantyfonta.github.io/Grammar/', category: 'sage', categoryName: 'Sage Scrolls', rank: 'C', reward: '150 Gold • Jester Badge', icon: '✍️' },
        { id: 'S6', title: 'Graphing Calculator', description: 'Works with most graphs.', link: 'https://gantyfonta.github.io/gcalc/', category: 'sage', categoryName: 'Sage Scrolls', rank: 'B', reward: '400 Gold • Geometry Ring', icon: '📊' },

        // COMBAT & SNACK QUESTS (Games)
        { id: 'G1', title: 'Untitled Rouge', description: 'Choose a class and battle through the tower.', link: 'https://gantyfonta.github.io/untitledrouge/', category: 'combat', categoryName: 'Bounty Quests', rank: 'S', reward: '2,500 Gold • Mythic Blade', icon: '🗡️' },
        { id: 'G2', title: 'Boxy Stack Empire', description: 'Stack boxes and use powerful tools to make $$$.', link: 'https://gantyfonta.github.io/Boxy/', category: 'combat', categoryName: 'Bounty Quests', rank: 'A', reward: '1,200 Gold • Builder Crest', icon: '📦' },
        { id: 'G3', title: 'Brawl Star Arena', description: 'Brawl stars dont sue me please.', link: 'https://gantyfonta.github.io/brawl/', category: 'combat', categoryName: 'Bounty Quests', rank: 'B', reward: '600 Gold • Gladiator Shield', icon: '⭐' },
        { id: 'G4', title: 'Untitled Speedrun Platformer', description: 'The new single greatest speedrunning platformer.', link: 'https://gantyfonta.github.io/jump/', category: 'combat', categoryName: 'Bounty Quests', rank: 'S', reward: '2,000 Gold • Hermes Boots', icon: '🏃' },
        { id: 'G5', title: 'SprootTop Win98 Simulator', description: 'Windows 98 Sim on the Sproot.inc Laptop.', link: 'https://gantyfonta.github.io/Sproottop/', category: 'combat', categoryName: 'Bounty Quests', rank: 'A', reward: '1,000 Gold • Cyber Artifact', icon: '💻' },
        { id: 'G6', title: 'Cess (Overloaded Chess)', description: 'Chess, but too much.', link: 'https://gantyfonta.github.io/cess/', category: 'combat', categoryName: 'Bounty Quests', rank: 'A', reward: '1,100 Gold • Grandmaster Crown', icon: '♟️' },
        { id: 'G7', title: '2D Redstone Engine', description: '2D Minecraft redstone simulation featuring many redstone components.', link: 'https://gantyfonta.github.io/redstone/', category: 'combat', categoryName: 'Bounty Quests', rank: 'S', reward: '3,000 Gold • Redstone Core', icon: '⚡' },
        { id: 'G8', title: 'Polytrack Racing', description: 'Play a drive game made by Kodub.', link: 'https://gantyfonta.github.io/polytrack/', category: 'combat', categoryName: 'Bounty Quests', rank: 'S', reward: '1,800 Gold • Nitro Engine', icon: '🏎️' },
        { id: 'G9', title: 'Shapemon Duel', description: 'A Pokemon battle style game, but with shapes.', link: 'https://gantyfonta.github.io/Shapemon/', category: 'combat', categoryName: 'Bounty Quests', rank: 'B', reward: '750 Gold • Prism Stone', icon: '🔷' },
        { id: 'G10', title: 'Retro Vault Emulator', description: 'Play several games from older consoles.', link: 'https://gantyfonta.github.io/wdbgub/emulator/index.html', category: 'combat', categoryName: 'Bounty Quests', rank: 'S', reward: '2,200 Gold • Nostalgia Gem', icon: '🕹️' },
        { id: 'G11', title: 'Numberle Codebreaker', description: 'Play higher or lower in a wordle-ish number guessing game.', link: 'https://gantyfonta.github.io/Numberle/', category: 'combat', categoryName: 'Bounty Quests', rank: 'C', reward: '300 Gold • Decipher Ring', icon: '🔢' },
        { id: 'G12', title: "Caesar's Spelling Bee", description: 'Spell out the spoken latin words.', link: 'https://gantyfonta.github.io/SpellingBee/', category: 'combat', categoryName: 'Bounty Quests', rank: 'B', reward: '550 Gold • Laurel Wreath', icon: '🐝' },
        { id: 'G13', title: 'Online Chess Realm', description: 'Play chess against someone online.', link: 'https://gantyfonta.github.io/chess/', category: 'combat', categoryName: 'Bounty Quests', rank: 'B', reward: '650 Gold • Strategy Banner', icon: '🏰' },
        { id: 'G14', title: 'Stonks Market Sim', description: 'Pretend you have stocks in an always changing stonks game.', link: 'https://gantyfonta.github.io/Stonks/', category: 'combat', categoryName: 'Bounty Quests', rank: 'B', reward: '800 Gold • Merchant Coin', icon: '📈' },
        { id: 'G15', title: 'Forge of Legends', description: 'Make cool weapons, fight stuff. (Zoom out to see full weapons)', link: 'https://forge-of-legends-7e55fd62.base44.app/Forge', category: 'combat', categoryName: 'Bounty Quests', rank: 'S', reward: '3,500 Gold • Legendary Anvil', icon: '⚒️' },
        { id: 'G16', title: 'Tavern Slot Machine', description: 'Two words: Slot Machine.', link: 'https://gantyfonta.github.io/Gambling/', category: 'combat', categoryName: 'Bounty Quests', rank: 'C', reward: '???? Gold • Gambler Token', icon: '🎰' },
        { id: 'G17', title: 'Minotaur Maze Escape', description: 'Run from a minotaur in a maze.', link: 'https://gantyfonta.github.io/TheMaze/', category: 'combat', categoryName: 'Bounty Quests', rank: 'A', reward: '1,300 Gold • Labyrinth Map', icon: '🐂' },
        { id: 'G18', title: 'Culinary Craft', description: 'Jesse, we need to cook.', link: 'https://culinary-craft-07cb0bc3.base44.app/', category: 'combat', categoryName: 'Bounty Quests', rank: 'A', reward: '1,400 Gold • Flask of Power', icon: '🧪' },

        // MYSTERY & ARCANE (Misc)
        { id: 'M1', title: 'Conflict Meeting Chamber', description: 'A room based meeting site that works like Zoom.', link: 'https://gantyfonta.github.io/conflict-chat/', category: 'arcane', categoryName: 'Arcane Mysteries', rank: 'A', reward: '1,200 Gold • Crystal Ball', icon: '🔮' },
        { id: 'M2', title: 'Hand Physics Lab VR', description: 'A hand and face tracking simulation in 3D.', link: 'https://gantyfonta.github.io/HandPhysicsLab/', category: 'arcane', categoryName: 'Arcane Mysteries', rank: 'S', reward: '3,000 Gold • Spatial Gauntlets', icon: '🖐️' },
        { id: 'M3', title: 'Grak the Caveman AI', description: 'Chat with Grak, a caveman AI.', link: 'https://preview--aura-chat-copy-255598c1.base44.app/Chat?hide_badge=true', category: 'arcane', categoryName: 'Arcane Mysteries', rank: 'B', reward: '500 Gold • Flint & Steel', icon: '🦴' },
        { id: 'M4', title: 'Audio Synthesizer', description: 'Make music with arcane frequencies.', link: 'https://gantyfonta.github.io/synthesizer/', category: 'arcane', categoryName: 'Arcane Mysteries', rank: 'B', reward: '700 Gold • Bard Harp', icon: '🎵' },
        { id: 'M5', title: 'Robert British AI', description: 'Talk to the ultimate codemaking British AI.', link: 'https://robert.base44.app', category: 'arcane', categoryName: 'Arcane Mysteries', rank: 'A', reward: '1,000 Gold • Monocle of Intellect', icon: '🎩' },
        { id: 'M6', title: 'MultiCode Runner', description: 'Run most other websites / code inside of it.', link: 'https://gantyfonta.github.io/Multicoderunner/', category: 'arcane', categoryName: 'Arcane Mysteries', rank: 'S', reward: '2,800 Gold • Master Key', icon: '⚙️' },

        // OINK GUILD (Oink Treats)
        { id: 'O1', title: 'Oink-O-Clock Jump', description: 'The single greatest pig game ever made.', link: 'https://gantyfonta.github.io/oinkoclockjump/', category: 'oink', categoryName: 'Porcine Guild', rank: 'S', reward: '5,000 Gold • Golden Snout', icon: '🐷' },
        { id: 'O2', title: 'OOCJ Duel Battles', description: 'Two players. See whos the ultimate pig.', link: 'https://gantyfonta.github.io/OOCJBattles/', category: 'oink', categoryName: 'Porcine Guild', rank: 'A', reward: '1,500 Gold • Pig Championship Belt', icon: '⚔️' },
        { id: 'O3', title: 'Moinkcraft 2D Sandbox', description: 'A WIP 2D sandbox game about pigs.', link: 'https://gantyfonta.github.io/OOCJRouge/', category: 'oink', categoryName: 'Porcine Guild', rank: 'S', reward: '3,200 Gold • Mud Crown', icon: '⛏️' },

        // SHADOW REALM (Familiar)
        { id: 'E1', title: 'Sprootgle Parchment Docs', description: 'A very familiar seeming document program.', link: 'https://sproot-docs.base44.app', category: 'shadow', categoryName: 'Shadow Realm', rank: 'B', reward: '600 Gold • Illusion Scroll', icon: '📄' },
        { id: 'E2', title: 'Sprootify Bardic Player', description: 'A music app for all your music needs.', link: 'https://vibefy.base44.app/', category: 'shadow', categoryName: 'Shadow Realm', rank: 'B', reward: '650 Gold • Siren Flute', icon: '🎧' },
        { id: 'E3', title: 'Conflict Mirror Realm', description: 'A simple messaging app that looks familiar.', link: 'https://gantyfonta.github.io/conflict/', category: 'shadow', categoryName: 'Shadow Realm', rank: 'B', reward: '700 Gold • Shadow Mirror', icon: '💬' }
      ];

      // Rank Badges Styling Configuration
      const rankStyles = {
        'S': { bg: 'bg-amber-500/20 text-amber-300 border-amber-500/60', seal: 'bg-amber-700 text-amber-200' },
        'A': { bg: 'bg-purple-500/20 text-purple-300 border-purple-500/60', seal: 'bg-purple-800 text-purple-200' },
        'B': { bg: 'bg-blue-500/20 text-blue-300 border-blue-500/60', seal: 'bg-blue-800 text-blue-200' },
        'C': { bg: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/60', seal: 'bg-emerald-800 text-emerald-200' },
      };

      const App = () => {
        const [activeGuild, setActiveGuild] = useState('all');
        const [activeRank, setActiveRank] = useState('all');
        const [searchQuery, setSearchQuery] = useState('');
        const [acceptedQuests, setAcceptedQuests] = useState([]);
        const [goldCoins, setGoldCoins] = useState(4850);

        const handleAcceptQuest = (quest) => {
          if (!acceptedQuests.includes(quest.id)) {
            setAcceptedQuests([...acceptedQuests, quest.id]);
            setGoldCoins(prev => prev + 500);
          }
          window.open(quest.link, '_blank');
        };

        const filteredQuests = questCatalog.filter(q => {
          const matchesGuild = activeGuild === 'all' || q.category === activeGuild;
          const matchesRank = activeRank === 'all' || q.rank === activeRank;
          const matchesSearch = q.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                q.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                q.reward.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesGuild && matchesRank && matchesSearch;
        });

        return (
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            {/* TAVERN WOODEN FRAME CONTAINER */}
            <div className="wood-panel border-8 border-[#3b2314] rounded-2xl p-6 sm:p-10 relative overflow-hidden">
              
              {/* TOP HERO & GUILDMASTER HEADER */}
              <div className="border-b-4 border-[#3b2314] pb-8 mb-8 flex flex-col md:flex-row justify-between items-center gap-6">
                <div>
                  <div className="flex items-center gap-3">
                    <span className="text-3xl">🛡️</span>
                    <h1 className="medieval-title text-3xl sm:text-5xl font-black text-amber-200 tracking-wide drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)]">
                      THE ADVENTURER'S GUILD
                    </h1>
                  </div>
                  <p className="text-amber-400/80 text-sm sm:text-base mt-2 font-semibold">
                    Select a bounty quest scroll below to embark on digital domain expeditions.
                  </p>
                </div>

                {/* ADVENTURER STAT CARD */}
                <div className="bg-[#120a06] border-2 border-[#5c3a21] rounded-xl p-4 flex items-center gap-6 shadow-inner min-w-[280px]">
                  <div className="relative">
                    <div className="w-14 h-14 rounded-full bg-amber-900/60 border-2 border-amber-500 flex items-center justify-center text-2xl shadow-lg">
                      🧙‍♂️
                    </div>
                    <span className="absolute -bottom-1 -right-1 bg-amber-600 text-black text-[10px] font-black px-1.5 py-0.5 rounded-full border border-black">
                      LVL 34
                    </span>
                  </div>
                  <div>
                    <h4 className="medieval-title text-amber-200 font-bold text-lg">Guildmaster Ganty</h4>
                    <div className="flex items-center gap-4 text-xs mt-1 mono-text">
                      <span className="text-amber-400 font-bold flex items-center gap-1">
                        🪙 {goldCoins.toLocaleString()} GP
                      </span>
                      <span className="text-emerald-400 font-bold">
                        📜 {acceptedQuests.length} Quests
                      </span>
                    </div>
                  </div>
                </div>
              </div>

              {/* FILTERING CONTROLS PANEL */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8">
                
                {/* SEARCH PARCHMENT INPUT */}
                <div className="lg:col-span-5">
                  <label className="block text-xs text-amber-400/80 font-bold mb-2 uppercase tracking-wider">
                    Search Quest Archives
                  </label>
                  <div className="relative">
                    <input
                      type="text"
                      className="w-full bg-[#ebd2ad] text-[#2b1810] placeholder-[#6b4733] font-bold border-2 border-[#b38e58] rounded-lg px-4 py-2.5 pl-10 focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all text-sm shadow-md"
                      placeholder="Search quest name, reward, keyword..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                    />
                    <span className="absolute left-3 top-2.5 text-base text-[#6b4733]">🔍</span>
                  </div>
                </div>

                {/* GUILD / CATEGORY FILTER BUTTONS */}
                <div className="lg:col-span-7 flex flex-col justify-end">
                  <label className="block text-xs text-amber-400/80 font-bold mb-2 uppercase tracking-wider">
                    Guild Halls & Ranks
                  </label>
                  <div className="flex flex-wrap gap-2">
                    
                    {/* Guild Filter Pills */}
                    {[
                      { key: 'all', label: 'All Guilds', icon: '🏛️' },
                      { key: 'sage', label: 'Sage Scrolls', icon: '📜' },
                      { key: 'combat', label: 'Bounty Quests', icon: '⚔️' },
                      { key: 'arcane', label: 'Arcane', icon: '🔮' },
                      { key: 'oink', label: 'Porcine Guild', icon: '🐷' },
                      { key: 'shadow', label: 'Shadow Realm', icon: '👁️' }
                    ].map(g => (
                      <button
                        key={g.key}
                        onClick={() => setActiveGuild(g.key)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 border ${
                          activeGuild === g.key
                            ? 'bg-amber-600 text-black border-amber-300 shadow-[0_0_10px_rgba(217,119,6,0.5)]'
                            : 'bg-[#120a06] text-amber-300/80 border-[#3b2314] hover:bg-[#2b1810]'
                        }`}
                      >
                        <span>{g.icon}</span> {g.label}
                      </button>
                    ))}

                    <div className="h-6 w-0.5 bg-[#3b2314] self-center mx-1 hidden sm:block"></div>

                    {/* Rank Filter Pills */}
                    {['all', 'S', 'A', 'B', 'C'].map(r => (
                      <button
                        key={r}
                        onClick={() => setActiveRank(r)}
                        className={`px-2.5 py-1 rounded text-xs font-black transition-all border ${
                          activeRank === r
                            ? 'bg-amber-400 text-black border-amber-200'
                            : 'bg-[#120a06] text-amber-400/60 border-[#3b2314] hover:text-amber-200'
                        }`}
                      >
                        {r === 'all' ? 'RANK ALL' : `RANK ${r}`}
                      </button>
                    ))}

                  </div>
                </div>

              </div>

              {/* QUEST BOARD PARCHMENT CARDS GRID */}
              {filteredQuests.length > 0 ? (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredQuests.map((quest) => {
                    const style = rankStyles[quest.rank];
                    const isAccepted = acceptedQuests.includes(quest.id);

                    return (
                      <div
                        key={quest.id}
                        className="parchment-card rounded-xl p-5 relative flex flex-col justify-between transition-all duration-300 hover:-translate-y-2 group"
                      >
                        {/* CARD TOP BAR: RANK BADGE & WAX SEAL */}
                        <div>
                          <div className="flex justify-between items-center mb-3">
                            <span className={`px-2.5 py-0.5 rounded border text-xs font-black mono-text ${style.bg}`}>
                              RANK {quest.rank}
                            </span>
                            
                            {/* Decorative Wax Seal Icon */}
                            <div className={`w-8 h-8 rounded-full ${style.seal} wax-seal flex items-center justify-center text-sm font-bold shadow-md`}>
                              {quest.icon}
                            </div>
                          </div>

                          {/* QUEST TITLE & DESCRIPTION */}
                          <h3 className="medieval-title font-black text-xl text-[#2b1810] group-hover:text-amber-900 transition-colors leading-tight mb-2">
                            {quest.title}
                          </h3>
                          
                          <p className="text-xs text-[#523324] font-medium leading-relaxed mb-4">
                            {quest.description}
                          </p>
                        </div>

                        {/* REWARD INFO & ACCEPT BUTTON */}
                        <div>
                          <div className="border-t border-[#b38e58]/50 pt-3 mb-4 flex items-center justify-between text-xs font-bold text-[#422619] mono-text">
                            <span>REWARD:</span>
                            <span className="text-amber-900 bg-amber-200/60 px-2 py-0.5 rounded border border-amber-400/50">
                              {quest.reward}
                            </span>
                          </div>

                          <button
                            onClick={() => handleAcceptQuest(quest)}
                            className={`w-full py-2.5 rounded-lg font-black medieval-title tracking-wider text-sm transition-all shadow-md flex items-center justify-center gap-2 ${
                              isAccepted
                                ? 'bg-emerald-800 text-emerald-100 hover:bg-emerald-700 border border-emerald-600'
                                : 'bg-[#3b1d11] text-amber-200 hover:bg-[#592c19] border border-[#6f3820] hover:text-white'
                            }`}
                          >
                            <span>{isAccepted ? '✓ COMPLETED' : '⚔️ ACCEPT QUEST'}</span>
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div className="text-center py-20 bg-[#120a06]/50 rounded-xl border-2 border-dashed border-[#3b2314]">
                  <div className="text-6xl mb-3">📜</div>
                  <h3 className="medieval-title text-2xl text-amber-300 font-bold">No Bounty Scrolls Found</h3>
                  <p className="text-xs text-amber-500/70 mt-1">Try resetting your guild filters or search term.</p>
                </div>
              )}

              {/* FOOTER */}
              <footer className="mt-12 pt-6 border-t-2 border-[#3b2314] text-center text-xs text-amber-500/60 mono-text">
                © 2026 Ganty's Adventurer Guild. Bounties subject to immediate realm teleportation.
              </footer>

            </div>

          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
