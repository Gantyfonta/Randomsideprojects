<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ganty's Project Vending Machine</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Fredoka', sans-serif;
        background-color: #12131C;
        color: #F3F4F6;
      }

      .led-display {
        font-family: 'VT323', monospace;
        background-color: #051A05;
        color: #33FF33;
        text-shadow: 0 0 5px #33FF33;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
      }

      .mono-text {
        font-family: 'Share Tech Mono', monospace;
      }

      /* Vending Machine Glass Effect */
      .vending-glass {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(255, 255, 255, 0.05) 100%);
        box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(255, 255, 255, 0.05);
      }

      /* Coil effect behind items */
      .coil-spring {
        background: repeating-linear-gradient(
          90deg,
          transparent,
          transparent 8px,
          rgba(255, 255, 255, 0.2) 8px,
          rgba(255, 255, 255, 0.2) 12px
        );
      }

      html { scroll-behavior: smooth; }

      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #181824; }
      ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="antialiased selection:bg-emerald-500 selection:text-black min-h-screen py-8">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // -----------------------------------------------------------------
      // DATA CONFIGURATION WITH VENDING ROW CODES
      // -----------------------------------------------------------------
      const projectData = {
        school: {
          rowCode: 'A', name: 'Brain Juice', icon: '🧠', actionText: 'VEND ITEM',
          items: [
            { title: 'Latin Dictionary WIP', description: 'Latin dictionary for all your latin dictionary needs!', link: 'https://gantyfonta.github.io/LD/' },
            { title: 'Significant Figures Calculator', description: 'Do math with rounding and automatic SF handling.', link: 'https://gantyfonta.github.io/SigFigCalc/' },
            { title: 'Latin AI', description: 'Ask for help to an AI chatbot.', link: 'https://latinusmagister.base44.app/' },
            { title: 'Outlet', description: 'Paste in flashcards or vocab words and study them.', link: 'https://owtlette.base44.app/' },
            { title: 'Things From Grammer', description: 'I purposely misspelled Grammar to ragbait tesco.', link: 'https://gantyfonta.github.io/Grammar/' },
            { title: 'Graphing Calculator', description: 'Works with most graphs.', link: 'https://gantyfonta.github.io/gcalc/' },
          ]
        },
        games: {
          rowCode: 'B', name: 'Snack Games', icon: '🕹️', actionText: 'VEND ITEM',
          items: [
            { title: 'Untitled Rouge', description: 'Choose a class and battle through the tower.', link:'https://gantyfonta.github.io/untitledrouge/'},
            { title: 'Boxy', description: 'Stack boxes and use poweful tools to make $$$.', link: 'https://gantyfonta.github.io/Boxy/' },
            { title: 'Brawl Star', description: 'Brawl stars dont sue me please.', link: 'https://gantyfonta.github.io/brawl/' },
            { title: 'Untitled Platformer', description: 'The new single greatest speedruning platformer.', link: 'https://gantyfonta.github.io/jump/' },
            { title: 'SprootTop', description: 'Windows 98 Sim on the Sproot.inc Laptop.', link: 'https://gantyfonta.github.io/Sproottop/' },
            { title: 'Cess', description: 'Chess, but too much.', link: 'https://gantyfonta.github.io/cess/' },
            { title: 'Redstone Simulator', description: '2D Minecraft redstone simulation featuring many redstone components.', link: 'https://gantyfonta.github.io/redstone/' },
            { title: 'Polytrack', description: 'Play a drive game made by Kodub.', link: 'https://gantyfonta.github.io/polytrack/' },
            { title: 'Shapemon', description: 'A Pokemon battle style game, but with shapes.', link: 'https://gantyfonta.github.io/Shapemon/' },
            { title: 'Emulator', description: 'Play several games from older consoles.', link: 'https://gantyfonta.github.io/wdbgub/emulator/index.html' },
            { title: 'Numberle', description: 'Play higher or lower in a wordle-ish number guessing game.', link: 'https://gantyfonta.github.io/Numberle/' },
            { title: "Caesar's Spelling Bee", description: 'Spell out the spoken latin words.', link: 'https://gantyfonta.github.io/SpellingBee/' },
            { title: 'Chess', description: 'Play chess against someone online.', link: 'https://gantyfonta.github.io/chess/' },
            { title: 'Stonks', description: 'Pretend you have stocks in an always changing stonks game.', link: 'https://gantyfonta.github.io/Stonks/' },
            { title: 'Forge of Legends', description: 'Make cool weapons, fight stuff. (Zoom out to see full weapons)', link: 'https://forge-of-legends-7e55fd62.base44.app/Forge' },
            { title: 'Gambling', description: 'Two words: Slot Machine.', link: 'https://gantyfonta.github.io/Gambling/' },
            { title: 'The Maze', description: 'Run from a minotaur in a maze.', link: 'https://gantyfonta.github.io/TheMaze/' },
            { title: 'RNG', description: 'A poorly made RNG game.', link: 'https://gantyfonta.github.io/Rng/' },
            { title: 'Poker', description: 'Classic poker.', link: 'https://gantyfonta.github.io/Poker/' },
            { title: 'Blackjack', description: 'Reach 21 to win.', link: 'https://gantyfonta.github.io/Blackjack/' },
            { title: 'Russian Roulette', description: 'Simple (bad) Russian Roulette.', link: 'https://gantyfonta.github.io/RussianRoulette/' },
            { title: 'Culinary Craft', description: 'Jesse, we need to cook.', link: 'https://culinary-craft-07cb0bc3.base44.app/' },
            { title: 'Chalkboard', description: 'Draw on a chalkboard with people.', link: 'https://gantyfonta.github.io/chalkboard/' },
            { title: 'Multiplayer Checkboxes', description: 'Click checkboxes and see them on other peoples screens.', link: 'https://gantyfonta.github.io/checkboxes/' },
            { title: 'Lightbulb', description: 'To turn on or off lightbulbs.', link: 'https://gantyfonta.github.io/Lightbulb/' },
          ]
        },
        misc: {
          rowCode: 'C', name: 'Mystery Snacks', icon: '🌀', actionText: 'VEND ITEM',
          items: [
            { title: 'Conflict Rooms', description: 'A room based meeting site that works like Zoom and looks like Conflict.', link: 'https://gantyfonta.github.io/conflict-chat/' },
            { title: 'Hand Physics Lab', description: 'A hand and face tracking simulation in 3D.', link: 'https://gantyfonta.github.io/HandPhysicsLab/' },
            { title: 'Grak the AI Caveman', description: 'Chat with Grak, a caveman AI.', link: 'https://preview--aura-chat-copy-255598c1.base44.app/Chat?hide_badge=true' },
            { title: 'Synthesizer', description: 'Make music.', link: 'https://gantyfonta.github.io/synthesizer/' },
            { title: 'Robert the AI', description: 'Talk to the ultimate codemaking British AI.', link: 'https://robert.base44.app' },
            { title: 'GantyMail', description: 'Another email(chat) system to talk to people.', link: 'https://gantyfonta.github.io/gantymail/' },
            { title: 'Blurp', description: 'Create an account, add people and talk to them.', link: 'https://gantyfonta.github.io/blurp/' },
            { title: 'MultiCode Runner', description: 'Run most other websites / code inside of it.', link: 'https://gantyfonta.github.io/Multicoderunner/' },
            { title: 'Grak 2.0', description: 'Grak, but obsessed with space.', link: 'https://gantyfonta.github.io/grak2.0/' },
            { title: 'Grak (oldest)', description: 'The oldest primordial Grak.', link: 'https://gantyfonta.github.io/grak/' },
          ]
        },
        oink: {
          rowCode: 'D', name: "Oink Treats", icon: '🐷', actionText: 'VEND ITEM',
          items: [
            { title: 'Oink-O-Clock Jump', description: 'The single greatest game ever made.', link: 'https://gantyfonta.github.io/oinkoclockjump/' },
            { title: 'OOCJ Battles', description: 'Two players. See whos the best.', link: 'https://gantyfonta.github.io/OOCJBattles/' },
            { title: 'Moinkcraft', description: 'A WIP 2D sandbox game about pigs.', link: 'https://gantyfonta.github.io/OOCJRouge/' },
          ]
        },
        familiar: {
          rowCode: 'E', name: 'Odd Goodies', icon: '👁️', actionText: 'VEND ITEM',
          items: [
            { title: 'Sprootgle Docs', description: 'A very familiar seeming document program.', link: 'https://sproot-docs.base44.app' },
            { title: 'Sprootify', description: 'A music app for all your music needs.', link: 'https://vibefy.base44.app/' },
            { title: 'Conflict', description: 'A simple messaging app that looks familiar.', link: 'https://gantyfonta.github.io/conflict/' },
          ]
        }
      };

      // Assign global slot codes (A1, A2, B1, B2...) to all items
      const catalog = [];
      Object.keys(projectData).forEach(catKey => {
        const cat = projectData[catKey];
        cat.items.forEach((item, idx) => {
          const code = `${cat.rowCode}${idx + 1}`;
          catalog.push({
            ...item,
            code,
            categoryKey: catKey,
            categoryName: cat.name,
            icon: cat.icon
          });
        });
      });

      // -------------------- MAIN APP --------------------
      const App = () => {
        const [typedCode, setTypedCode] = useState('');
        const [activeCategory, setActiveCategory] = useState('all');
        const [searchQuery, setSearchQuery] = useState('');
        const [displayMessage, setDisplayMessage] = useState('READY - ENTER CODE');
        const [droppedItem, setDroppedItem] = useState(null);

        const handleKeypress = (char) => {
          if (typedCode.length < 3) {
            const nextCode = typedCode + char;
            setTypedCode(nextCode);
            setDisplayMessage(`SLOT: ${nextCode}`);
          }
        };

        const handleClear = () => {
          setTypedCode('');
          setDisplayMessage('READY - ENTER CODE');
        };

        const handleVend = () => {
          if (!typedCode) {
            setDisplayMessage('ENTER CODE FIRST');
            return;
          }
          const found = catalog.find(i => i.code.toUpperCase() === typedCode.toUpperCase());
          if (found) {
            setDisplayMessage(`DISPENSING: ${found.code}`);
            setDroppedItem(found);
            setTimeout(() => {
              window.open(found.link, '_blank');
              setDisplayMessage('THANK YOU! DISPENSED');
            }, 800);
          } else {
            setDisplayMessage('ERR: INVALID SLOT');
            setTimeout(() => setDisplayMessage('READY - ENTER CODE'), 1500);
          }
        };

        const handleSearchChange = (e) => {
          const value = e.target.value;
          setSearchQuery(value);
          if (value.toLowerCase() === 'bird') window.location.href = 'bird.html';
          if (value.toLowerCase() === 'jump') window.location.href = 'jump.html';
        };

        // Filter catalog by active category and search input
        const filteredCatalog = catalog.filter(item => {
          const matchesCategory = activeCategory === 'all' || item.categoryKey === activeCategory;
          const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                item.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                item.code.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });

        return (
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            {/* VENDING MACHINE OUTER CABINET */}
            <div className="bg-[#1C1D26] border-8 border-[#2A2B38] rounded-3xl p-6 sm:p-8 shadow-[0_20px_50px_rgba(0,0,0,0.8)] relative overflow-hidden">
              
              {/* TOP HEADER / BRANDING */}
              <div className="flex flex-col sm:flex-row justify-between items-center mb-8 border-b-4 border-[#2A2B38] pb-6 gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-4 h-4 rounded-full bg-emerald-400 animate-pulse"></div>
                  <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-100 tracking-wider uppercase">
                    Ganty-Mat <span className="text-emerald-400">3000</span>
                  </h1>
                </div>

                {/* CATEGORY SELECTOR BUTTONS */}
                <div className="flex flex-wrap justify-center gap-2">
                  <button
                    onClick={() => setActiveCategory('all')}
                    className={`px-3 py-1.5 rounded-lg text-sm font-bold transition-all ${
                      activeCategory === 'all'
                        ? 'bg-emerald-500 text-black shadow-[0_0_10px_rgba(16,185,129,0.5)]'
                        : 'bg-[#2A2B38] text-slate-300 hover:bg-[#373849]'
                    }`}
                  >
                    ALL SLOTS
                  </button>
                  {Object.keys(projectData).map(catKey => {
                    const cat = projectData[catKey];
                    return (
                      <button
                        key={catKey}
                        onClick={() => setActiveCategory(catKey)}
                        className={`px-3 py-1.5 rounded-lg text-sm font-bold transition-all flex items-center gap-1 ${
                          activeCategory === catKey
                            ? 'bg-emerald-500 text-black shadow-[0_0_10px_rgba(16,185,129,0.5)]'
                            : 'bg-[#2A2B38] text-slate-300 hover:bg-[#373849]'
                        }`}
                      >
                        <span>{cat.icon}</span> [{cat.rowCode}] {cat.name}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* MAIN LAYOUT: GLASS SHELVES (LEFT) + CONTROL PANEL (RIGHT) */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                {/* GLASS DISPLAY CABINET (ITEMS) */}
                <div className="lg:col-span-8 vending-glass border-4 border-[#2A2B38] rounded-2xl p-6 min-h-[550px] flex flex-col justify-between relative overflow-y-auto max-h-[700px]">
                  
                  {filteredCatalog.length > 0 ? (
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                      {filteredCatalog.map((item) => (
                        <div
                          key={item.code}
                          onClick={() => {
                            setTypedCode(item.code);
                            setDisplayMessage(`SELECTED: ${item.code}`);
                          }}
                          className={`group relative bg-[#13141C]/80 border-2 rounded-xl p-4 cursor-pointer transition-all duration-300 hover:-translate-y-1 flex flex-col justify-between ${
                            typedCode === item.code
                              ? 'border-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.4)]'
                              : 'border-slate-700/60 hover:border-slate-400'
                          }`}
                        >
                          {/* Slot Sticker Badge */}
                          <div className="flex justify-between items-center mb-2">
                            <span className="mono-text bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-2.5 py-0.5 rounded text-xs font-bold">
                              {item.code}
                            </span>
                            <span className="text-xl">{item.icon}</span>
                          </div>

                          {/* Item Title & Description */}
                          <div className="my-2">
                            <h3 className="font-bold text-slate-100 text-lg group-hover:text-emerald-400 transition-colors leading-snug">
                              {item.title}
                            </h3>
                            <p className="text-xs text-slate-400 mt-1 line-clamp-2 leading-relaxed">
                              {item.description}
                            </p>
                          </div>

                          {/* Decorative Spiral Coil Springs */}
                          <div className="coil-spring h-3 w-full rounded mt-3 border-t border-slate-700/40"></div>

                          {/* Click-to-Select CTA */}
                          <a
                            href={item.link}
                            target="_blank"
                            rel="noopener noreferrer"
                            onClick={(e) => e.stopPropagation()}
                            className="mt-3 block text-center bg-slate-800 hover:bg-emerald-500 hover:text-black text-xs font-bold text-slate-300 py-1.5 rounded transition-all"
                          >
                            DIRECT OPEN ➔
                          </a>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div className="m-auto text-center py-16">
                      <div className="text-5xl mb-4">🤖</div>
                      <h3 className="text-xl font-bold text-slate-300">Slot Empty or Not Found</h3>
                      <p className="text-sm text-slate-500 mt-1">Try resetting search query or selecting another row.</p>
                    </div>
                  )}

                </div>

                {/* KEYPAD CONTROL PANEL (RIGHT SIDE) */}
                <div className="lg:col-span-4 bg-[#14151E] border-4 border-[#2A2B38] rounded-2xl p-6 flex flex-col justify-between">
                  <div>
                    {/* LED DISPLAY SCREEN */}
                    <div className="mb-6">
                      <div className="text-xs text-slate-400 font-bold mb-1 tracking-wider uppercase flex justify-between">
                        <span>Vending Status</span>
                        <span>24V DIGITAL</span>
                      </div>
                      <div className="led-display rounded-lg p-4 text-2xl font-bold tracking-widest text-center border-2 border-emerald-900/50 min-h-[70px] flex items-center justify-center">
                        {displayMessage}
                      </div>
                    </div>

                    {/* SEARCH INPUT */}
                    <div className="mb-6">
                      <label className="block text-xs text-slate-400 font-bold mb-1 tracking-wider uppercase">
                        Quick Filter:
                      </label>
                      <input
                        type="text"
                        className="w-full bg-[#1C1D26] border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-sm focus:outline-none focus:border-emerald-400 transition-colors"
                        placeholder="Search title, desc, or code..."
                        value={searchQuery}
                        onChange={handleSearchChange}
                      />
                    </div>

                    {/* NUMERIC & LETTER KEYPAD */}
                    <div className="mb-6">
                      <label className="block text-xs text-slate-400 font-bold mb-2 tracking-wider uppercase text-center">
                        Keypad Matrix
                      </label>
                      
                      {/* Letters (A, B, C, D, E) */}
                      <div className="grid grid-cols-5 gap-2 mb-3">
                        {['A', 'B', 'C', 'D', 'E'].map(char => (
                          <button
                            key={char}
                            onClick={() => handleKeypress(char)}
                            className="bg-[#2A2B38] hover:bg-emerald-500 hover:text-black text-slate-100 font-bold py-2.5 rounded-lg border-b-4 border-[#181922] active:border-b-0 active:translate-y-1 transition-all text-sm"
                          >
                            {char}
                          </button>
                        ))}
                      </div>

                      {/* Numbers (1 - 9) */}
                      <div className="grid grid-cols-3 gap-2 mb-3">
                        {['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(num => (
                          <button
                            key={num}
                            onClick={() => handleKeypress(num)}
                            className="bg-[#2A2B38] hover:bg-emerald-500 hover:text-black text-slate-100 font-bold py-2.5 rounded-lg border-b-4 border-[#181922] active:border-b-0 active:translate-y-1 transition-all text-sm"
                          >
                            {num}
                          </button>
                        ))}
                      </div>

                      {/* Action Buttons (Clear & Vend) */}
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={handleClear}
                          className="bg-rose-900/40 hover:bg-rose-600 text-rose-200 hover:text-white font-bold py-3 rounded-lg border-b-4 border-rose-950 active:border-b-0 active:translate-y-1 transition-all text-sm"
                        >
                          CLEAR
                        </button>
                        <button
                          onClick={handleVend}
                          className="bg-emerald-600 hover:bg-emerald-400 text-slate-950 font-extrabold py-3 rounded-lg border-b-4 border-emerald-900 active:border-b-0 active:translate-y-1 transition-all text-sm tracking-wider shadow-[0_0_15px_rgba(16,185,129,0.3)]"
                        >
                          VEND ➔
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* COIN SLOT / DROP TRAY GRAPHIC */}
                  <div className="mt-4 border-t-2 border-slate-800 pt-4">
                    <div className="bg-[#0C0D12] border-2 border-slate-800 rounded-xl p-4 text-center">
                      <div className="text-xs text-slate-500 font-bold mb-1 uppercase tracking-wider">
                        PUSH RETRIEVAL SLOT
                      </div>
                      <div className="bg-[#181924] h-10 rounded border-b-2 border-slate-700 flex items-center justify-center text-xs text-slate-400 font-mono">
                        {droppedItem ? (
                          <span className="text-emerald-400 font-bold animate-bounce">
                            🎁 DISPENSED: {droppedItem.title}
                          </span>
                        ) : (
                          '=== PUSH ==='
                        )}
                      </div>
                    </div>
                  </div>

                </div>

              </div>

              {/* FOOTER */}
              <footer className="mt-8 pt-4 border-t-2 border-[#2A2B38] text-center text-xs text-slate-500 font-mono">
                © 2026 GantyFonta. All items stocked fresh daily.
              </footer>

            </div>

          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
