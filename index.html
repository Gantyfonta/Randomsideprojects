<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Side Projects | Database</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #121212; 
        color: #D4D4D4; 
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #555; }
      
      /* Smooth transitions for the sidebar */
      .sidebar-transition {
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="antialiased selection:bg-[#3e3e3e] selection:text-white text-[15px]">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // -----------------------------------------------------------------
      // DATA CONFIGURATION (Your original data remains unchanged)
      // -----------------------------------------------------------------
      const projectData = {
        school: {
          name: 'School Projects', icon: '🎓', actionText: 'Open',
          items: [
            { title: 'Latin Dictionary WIP', description: 'Latin dictionary for all your latin dictionary needs!', link: 'https://gantyfonta.github.io/LD/' },
            { title: 'Significant Figures Calculator', description: 'Do math with rounding and automatic SF handling.', link: 'https://gantyfonta.github.io/SigFigCalc/' },
            { title: 'Latin AI', description: 'Ask for help to an AI chatbot.', link: 'https://latinusmagister.base44.app/' },
            { title: 'Outlet', description: 'Paste in flashcards or vocab words and study them.', link: 'https://owtlette.base44.app/' },
            { title: 'Things From Grammer', description: 'I purposely misspelled Grammar to ragbait tesco.', link: 'https://gantyfonta.github.io/Grammar/' },
            { title: 'Graphing Calculator', description: 'Works with most graphs.', link: 'https://gantyfonta.github.io/gcalc/' },
          ]
        },
        games: {
          name: 'Random Games', icon: '🎮', actionText: 'Play',
          items: [
            { title: 'Untitled Rouge', description: 'Choose a class and battle through the tower.', link:'https://gantyfonta.github.io/untitledrouge/'},
            { title: 'Boxy', description: 'Stack boxes and use poweful tools to make $$$.', link: 'https://gantyfonta.github.io/Boxy/' },
            { title: 'Brawl Star', description: 'Brawl stars dont sue me please.', link: 'https://gantyfonta.github.io/brawl/' },
            { title: 'Untitled Platformer', description: 'The new single greatest speedruning platformer.', link: 'https://gantyfonta.github.io/jump/' },
            { title: 'SprootTop', description: 'Windows 98 Sim on the Sproot.inc Laptop.', link: 'https://gantyfonta.github.io/Sproottop/' },
            { title: 'Cess', description: 'Chess, but too much.', link: 'https://gantyfonta.github.io/cess/' },
            { title: 'Redstone Simulator', description: '2D Minecraft redstone simulation featuring many redstone components.', link: 'https://gantyfonta.github.io/redstone/' },
            { title: 'Polytrack', description: 'Play a drive game made by Kodub.', link: 'https://gantyfonta.github.io/polytrack/' },
            { title: 'Shapemon', description: 'A Pokemon battle style game, but with shapes.', link: 'https://gantyfonta.github.io/Shapemon/' },
            { title: 'Emulator', description: 'Play several games from older consoles.', link: 'https://gantyfonta.github.io/wdbgub/emulator/index.html' },
            { title: 'Numberle', description: 'Play higher or lower in a wordle-ish number guessing game.', link: 'https://gantyfonta.github.io/Numberle/' },
            { title: "Caesar's Spelling Bee", description: 'Spell out the spoken latin words.', link: 'https://gantyfonta.github.io/SpellingBee/' },
            { title: 'Chess', description: 'Play chess against someone online.', link: 'https://gantyfonta.github.io/chess/' },
            { title: 'Stonks', description: 'Pretend you have stocks in an always changing stonks game.', link: 'https://gantyfonta.github.io/Stonks/' },
            { title: 'Forge of Legends', description: 'Make cool weapons, fight stuff. (Zoom out to see full weapons)', link: 'https://forge-of-legends-7e55fd62.base44.app/Forge' },
            { title: 'Gambling', description: 'Two words: Slot Machine.', link: 'https://gantyfonta.github.io/Gambling/' },
            { title: 'The Maze', description: 'Run from a minotaur in a maze.', link: 'https://gantyfonta.github.io/TheMaze/' },
            { title: 'RNG', description: 'A poorly made RNG game.', link: 'https://gantyfonta.github.io/Rng/' },
            { title: 'Poker', description: 'Classic poker.', link: 'https://gantyfonta.github.io/Poker/' },
            { title: 'Blackjack', description: 'Reach 21 to win.', link: 'https://gantyfonta.github.io/Blackjack/' },
            { title: 'Russian Roulette', description: 'Simple (bad) Russian Roulette.', link: 'https://gantyfonta.github.io/RussianRoulette/' },
            { title: 'Culinary Craft', description: 'Jesse, we need to cook.', link: 'https://culinary-craft-07cb0bc3.base44.app/' },
            { title: 'Chalkboard', description: 'Draw on a chalkboard with people.', link: 'https://gantyfonta.github.io/chalkboard/' },
            { title: 'Multiplayer Checkboxes', description: 'Click checkboxes and see them on other peoples screens.', link: 'https://gantyfonta.github.io/checkboxes/' },
            { title: 'Lightbulb', description: 'To turn on or off lightbulbs.', link: 'https://gantyfonta.github.io/Lightbulb/' },
          ]
        },
        misc: {
          name: 'Miscellaneous', icon: '⚡', actionText: 'Open',
          items: [
            { title: 'Conflict Rooms', description: 'A room based meeting site that works like Zoom and looks like Conflict.', link: 'https://gantyfonta.github.io/conflict-chat/' },
            { title: 'Hand Physics Lab', description: 'A hand and face tracking simulation in 3D.', link: 'https://gantyfonta.github.io/HandPhysicsLab/' },
            { title: 'Grak the AI Caveman', description: 'Chat with Grak, a caveman AI.', link: 'https://preview--aura-chat-copy-255598c1.base44.app/Chat?hide_badge=true' },
            { title: 'Synthesizer', description: 'Make music.', link: 'https://gantyfonta.github.io/synthesizer/' },
            { title: 'Robert the AI', description: 'Talk to the ultimate codemaking British AI.', link: 'https://robert.base44.app' },
            { title: 'GantyMail', description: 'Another email(chat) system to talk to people.', link: 'https://gantyfonta.github.io/gantymail/' },
            { title: 'Blurp', description: 'Create an account, add people and talk to them.', link: 'https://gantyfonta.github.io/blurp/' },
            { title: 'MultiCode Runner', description: 'Run most other websites / code inside of it.', link: 'https://gantyfonta.github.io/Multicoderunner/' },
            { title: 'Grak 2.0', description: 'Grak, but obsessed with space.', link: 'https://gantyfonta.github.io/grak2.0/' },
            { title: 'Grak (oldest)', description: 'The oldest primordial Grak.', link: 'https://gantyfonta.github.io/grak/' },
          ]
        },
        oink: {
          name: "Oink O' Stuff", icon: '🐷', actionText: 'Launch',
          items: [
            { title: 'Oink-O-Clock Jump', description: 'The single greatest game ever made.', link: 'https://gantyfonta.github.io/oinkoclockjump/' },
            { title: 'OOCJ Battles', description: 'Two players. See whos the best.', link: 'https://gantyfonta.github.io/OOCJBattles/' },
            { title: 'Moinkcraft', description: 'A WIP 2D sandbox game about pigs.', link: 'https://gantyfonta.github.io/OOCJRouge/' },
          ]
        },
        familiar: {
          name: 'Oddly Familiar', icon: '👁️', actionText: 'Visit',
          items: [
            { title: 'Sprootgle Docs', description: 'A very familiar seeming document program.', link: 'https://sproot-docs.base44.app' },
            { title: 'Sprootify', description: 'A music app for all your music needs.', link: 'https://vibefy.base44.app/' },
            { title: 'Conflict', description: 'A simple messaging app that looks familiar.', link: 'https://gantyfonta.github.io/conflict/' },
          ]
        }
      };

      // -------------------- COMPONENTS --------------------
      const DataTable = ({ category, data }) => (
        <div className="mb-12 animate-fade-in">
          <div className="flex items-center gap-3 mb-4 sticky top-[72px] bg-[#121212]/95 backdrop-blur-md py-3 z-10 border-b border-[#2e2e2e]">
            <span className="text-3xl">{category.icon}</span>
            <h2 className="text-2xl font-bold text-white tracking-tight">{category.name}</h2>
            <span className="ml-2 px-2.5 py-0.5 text-xs font-semibold bg-[#2e2e2e] text-[#d4d4d4] rounded-full">
              {data.length}
            </span>
          </div>
          
          <div className="w-full border border-[#2e2e2e] rounded-xl overflow-hidden bg-[#1a1a1a] shadow-lg">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="border-b border-[#2e2e2e] bg-[#222] text-[#888] text-sm uppercase tracking-wider">
                  <th className="py-4 px-6 font-semibold w-1/3">Project Name</th>
                  <th className="py-4 px-6 font-semibold w-7/12 hidden md:table-cell">Details</th>
                  <th className="py-4 px-6 font-semibold w-1/12 text-right">Link</th>
                </tr>
              </thead>
              <tbody>
                {data.map((item, idx) => (
                  <tr 
                    key={idx} 
                    className="border-b border-[#2e2e2e] last:border-0 hover:bg-[#2a2a2a] transition-all duration-200 group"
                  >
                    <td className="py-4 px-6 text-white font-medium">
                      {item.title}
                      {/* Mobile Description */}
                      <p className="text-sm text-[#888] font-normal mt-1 md:hidden">
                        {item.description}
                      </p>
                    </td>
                    <td className="py-4 px-6 text-[#999] hidden md:table-cell">
                      {item.description}
                    </td>
                    <td className="py-4 px-6 text-right">
                      <a 
                        href={item.link} 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="inline-flex items-center justify-center px-4 py-2 text-sm font-medium bg-[#333] text-white rounded-lg hover:bg-[#444] hover:scale-105 transition-all shadow-sm"
                      >
                        {category.actionText}
                      </a>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );

      // -------------------- MAIN APP --------------------
      const App = () => {
        const [searchQuery, setSearchQuery] = useState('');
        const [isSidebarOpen, setIsSidebarOpen] = useState(false);
        const [activeTab, setActiveTab] = useState('all');

        const handleSearchChange = (e) => {
          const value = e.target.value;
          setSearchQuery(value);
          // Easter eggs
          if (value.toLowerCase() === 'bird') window.location.href = 'bird.html';
          if (value.toLowerCase() === 'jump') window.location.href = 'jump.html';
        };

        // 1. Filter by active tab first
        let dataToFilter = Object.entries(projectData);
        if (activeTab !== 'all') {
          dataToFilter = dataToFilter.filter(([key]) => key === activeTab);
        }

        // 2. Filter by search query
        const filteredData = dataToFilter.map(([key, category]) => {
          const filteredItems = category.items.filter(item =>
            item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.description.toLowerCase().includes(searchQuery.toLowerCase())
          );
          return { ...category, items: filteredItems };
        }).filter(category => category.items.length > 0);

        // Close sidebar on escape key
        useEffect(() => {
          const handleEsc = (e) => { if (e.key === 'Escape') setIsSidebarOpen(false); };
          window.addEventListener('keydown', handleEsc);
          return () => window.removeEventListener('keydown', handleEsc);
        }, []);

        return (
          <div className="relative min-h-screen bg-[#121212] flex flex-col">
            
            {/* --- TOP NAVBAR --- */}
            <nav className="sticky top-0 z-40 w-full bg-[#121212]/90 backdrop-blur-md border-b border-[#2e2e2e] px-4 py-3 flex items-center justify-between">
              <button 
                onClick={() => setIsSidebarOpen(true)}
                className="flex items-center gap-2 px-3 py-2 bg-[#1a1a1a] hover:bg-[#2a2a2a] border border-[#2e2e2e] rounded-lg transition-colors text-white font-medium"
              >
                <span className="text-xl">☰</span>
                <span className="hidden sm:inline">Categories</span>
              </button>
              
              {/* Optional: Add a logo or small title on the top right */}
              <div className="text-[#888] font-medium text-sm hidden sm:block">
                Base44 Workspace
              </div>
            </nav>

            {/* --- SIDEBAR OVERLAY --- */}
            {isSidebarOpen && (
              <div 
                className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 transition-opacity"
                onClick={() => setIsSidebarOpen(false)}
              />
            )}

            {/* --- SIDEBAR DRAWER --- */}
            <aside 
              className={`fixed top-0 left-0 h-full w-72 bg-[#1a1a1a] border-r border-[#2e2e2e] z-50 sidebar-transition flex flex-col shadow-2xl ${
                isSidebarOpen ? 'translate-x-0' : '-translate-x-full'
              }`}
            >
              <div className="p-6 border-b border-[#2e2e2e] flex justify-between items-center">
                <h2 className="text-xl font-bold text-white">Navigation</h2>
                <button 
                  onClick={() => setIsSidebarOpen(false)}
                  className="text-[#888] hover:text-white text-2xl px-2 rounded-md hover:bg-[#333] transition-colors"
                >
                  &times;
                </button>
              </div>
              
              <div className="p-4 flex-1 overflow-y-auto flex flex-col gap-2">
                <button
                  onClick={() => { setActiveTab('all'); setIsSidebarOpen(false); }}
                  className={`flex items-center gap-3 w-full text-left px-4 py-3 rounded-lg font-medium transition-all ${
                    activeTab === 'all' ? 'bg-blue-600/20 text-blue-400 border border-blue-500/30' : 'text-[#a3a3a3] hover:bg-[#2e2e2e] hover:text-white'
                  }`}
                >
                  <span className="text-xl">📁</span> All Projects
                </button>
                
                <div className="my-2 border-t border-[#2e2e2e]"></div>
                <div className="text-xs font-bold text-[#666] uppercase tracking-wider mb-2 px-2">Categories</div>

                {Object.entries(projectData).map(([key, category]) => (
                  <button
                    key={key}
                    onClick={() => { setActiveTab(key); setIsSidebarOpen(false); }}
                    className={`flex items-center gap-3 w-full text-left px-4 py-3 rounded-lg font-medium transition-all ${
                      activeTab === key ? 'bg-[#333] text-white border border-[#444]' : 'text-[#a3a3a3] hover:bg-[#2e2e2e] hover:text-white'
                    }`}
                  >
                    <span className="text-xl">{category.icon}</span> {category.name}
                  </button>
                ))}
              </div>
            </aside>

            {/* --- MAIN CONTENT AREA --- */}
            <main className="flex-1 w-full max-w-[1000px] mx-auto px-4 py-12 md:px-8">
              
              {/* Header Document Area */}
              <header className="mb-16 text-center md:text-left flex flex-col items-center md:items-start">
                <h1 className="text-4xl md:text-5xl lg:text-6xl font-extrabold text-white tracking-tight mb-6 leading-tight">
                  Hello, could I interest you in a <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">project or two?</span>
                </h1>
                <p className="text-[#888] text-lg mb-10 max-w-2xl">
                  A master database of everything I've built. Use the sidebar to filter by category, or search directly below to find exactly what you're looking for.
                </p>

                {/* Upgraded Search Bar */}
                <div className="w-full max-w-2xl relative shadow-lg group">
                  <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <span className="text-xl">🔍</span>
                  </div>
                  <input
                    type="text"
                    className="w-full bg-[#1a1a1a] border-2 border-[#2e2e2e] focus:border-blue-500 rounded-xl py-4 pl-12 pr-12 outline-none text-[#d4d4d4] placeholder-[#666] text-lg transition-colors"
                    placeholder="Search for programs by words or anything..."
                    value={searchQuery}
                    onChange={handleSearchChange}
                  />
                  {searchQuery && (
                    <button 
                      onClick={() => setSearchQuery('')}
                      className="absolute inset-y-0 right-0 pr-4 flex items-center text-[#666] hover:text-white transition-colors"
                    >
                      <span className="text-xl">&times;</span>
                    </button>
                  )}
                </div>
              </header>

              {/* Data Tables */}
              <div className="space-y-8">
                {filteredData.length > 0 ? (
                  filteredData.map((category, index) => (
                    <DataTable key={index} category={category} data={category.items} />
                  ))
                ) : (
                  <div className="flex flex-col items-center justify-center py-20 text-center border-2 border-dashed border-[#2e2e2e] rounded-2xl bg-[#1a1a1a]/50">
                    <span className="text-5xl mb-4">📭</span>
                    <h3 className="text-xl font-semibold text-white mb-2">No projects found</h3>
                    <p className="text-[#888]">We couldn't find anything matching "{searchQuery}" in this category.</p>
                    <button 
                      onClick={() => {setSearchQuery(''); setActiveTab('all');}}
                      className="mt-6 px-6 py-2 bg-[#2e2e2e] hover:bg-[#3e3e3e] rounded-lg text-white font-medium transition-colors"
                    >
                      Clear Filters
                    </button>
                  </div>
                )}
              </div>
            </main>

            <footer className="mt-auto py-8 text-center border-t border-[#2e2e2e] text-sm text-[#555]">
              End of Database • Built with React & Tailwind
            </footer>
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
